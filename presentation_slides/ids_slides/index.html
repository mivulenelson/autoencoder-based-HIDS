<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Autoencoder Host-Based IDS for Encrypted Network Traffic</title>
<style>
:root{--bg:#0b1a2b;--card:#12283f;--tx:#eaf2fa;--mu:#9db3c8;--ac:#2dd4bf;--ac2:#60a5fa;--bd:#22405c;--warn:#fbbf24;--bad:#f87171}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f8fc;--card:#fff;--tx:#0b1a2b;--mu:#4b6379;--ac:#0d9488;--ac2:#2563eb;--bd:#d3e0ec;--warn:#b45309;--bad:#dc2626}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
#stage{flex:1;position:relative;min-height:0}
.s{position:absolute;inset:0;padding:clamp(16px,3.2vw,48px) clamp(18px,4vw,56px);display:none;flex-direction:column;justify-content:center;overflow-y:auto;animation:in .35s ease}
.s.on{display:flex}
@keyframes in{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.k{color:var(--ac);font-size:clamp(11px,1.3vw,14px);letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin-bottom:6px}
h1{font-size:clamp(24px,4.2vw,50px);line-height:1.15;margin:0 0 16px;max-width:24ch}
.title h1{max-width:22ch;font-size:clamp(26px,4.6vw,56px)}
h2{font-size:clamp(21px,3vw,36px);margin:0 0 16px;line-height:1.15}
h2:after{content:"";display:block;width:56px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--ac),var(--ac2));margin-top:10px}
ul{list-style:none;padding:0;margin:0;display:grid;gap:9px}
li{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:10px;padding:10px 15px;font-size:clamp(13.5px,1.6vw,19px);line-height:1.4}
li b{color:var(--ac)}
.meta{color:var(--mu);font-size:clamp(14px,1.8vw,21px);line-height:1.7}.meta b{color:var(--tx)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:15px}
.c .n{font-size:clamp(24px,3.4vw,42px);font-weight:800;color:var(--ac);line-height:1.1}
.c .n.w{color:var(--warn)}
.c h3{margin:0 0 4px;font-size:clamp(15px,1.8vw,20px)}
.c p,.c .l{margin:0;color:var(--mu);font-size:clamp(12.5px,1.4vw,16px);line-height:1.45}
.c .l small{display:block;margin-top:4px;opacity:.85}
.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:800px){.g3{grid-template-columns:1fr}}
.s:has(.res){padding-top:12px;padding-bottom:8px}.s:has(.res) h2{margin-bottom:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center}
.res{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;align-items:center}
@media(max-width:800px){.two,.res{grid-template-columns:1fr}}
img{max-width:100%;max-height:62vh;border-radius:10px;border:1px solid var(--bd);background:#fff;display:block;margin:0 auto}
.res img{max-height:68vh}
.cap{color:var(--mu);font-size:13px;text-align:center;margin-top:6px}
.note{color:var(--mu);margin-top:12px;font-size:clamp(12.5px,1.4vw,16px);line-height:1.5}
.note b{color:var(--tx)}
.warn{border-left-color:var(--warn)}.warn b{color:var(--warn)}
.cb{display:grid;gap:8px}
.cb div{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--ac2);border-radius:10px;padding:8px 12px;font-size:clamp(12.5px,1.35vw,16px);line-height:1.4;color:var(--mu)}
.cb div b{color:var(--ac2);margin-right:4px}
table{border-collapse:collapse;width:100%;font-size:clamp(11.5px,1.35vw,16px)}
th,td{border:1px solid var(--bd);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--card);color:var(--ac)}
.t1 td:last-child{color:var(--ac);font-weight:600}
.t2 td{text-align:center}.t2 td:first-child,.t2 th:first-child{text-align:left}.t2 th{text-align:center}
.t2 tr.me td{background:var(--card);font-weight:700;color:var(--ac)}
.wrap{overflow-x:auto}
.net{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.net span{background:var(--card);border:1px solid var(--ac);border-radius:8px;padding:10px 14px;font-weight:700;font-size:clamp(13px,1.6vw,18px);text-align:center}
.net span small{display:block;color:var(--mu);font-weight:400;font-size:.7em}
.net i{color:var(--ac);font-style:normal}
.eq{background:var(--card);border:1px solid var(--ac);border-radius:12px;padding:14px 18px;text-align:center;font-size:clamp(16px,2.2vw,28px);font-weight:700;margin-bottom:12px;font-family:"Cambria Math","Times New Roman",serif}
#bar{display:flex;align-items:center;gap:12px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--bd);background:var(--card)}
#pg{flex:1;height:4px;background:var(--bd);border-radius:2px;overflow:hidden}
#pg div{height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .3s}
button{background:transparent;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 16px;font-size:15px;cursor:pointer}
button:hover{border-color:var(--ac);color:var(--ac)}
a{color:var(--ac2);word-break:break-all}
#ct{color:var(--mu);font-size:14px;min-width:54px;text-align:center}
</style></head>
<body>
<div id="stage"></div>
<div id="bar"><button id="pv" aria-label="Previous">←</button><span id="ct"></span><div id="pg"><div></div></div><button id="fs" aria-label="Fullscreen">⛶</button><button id="nx" aria-label="Next">→</button></div>

var I=function(f,c){return'<img src="assets/'+f+'.jpg" alt="'+c+'" onerror="this.style.display=\'none\'"><div class="cap">'+c+'</div>'};

var S=[
'<div class="title"><div class="k">Bachelor of Computer Security &amp; Forensics · UTAMU</div><h1>An Autoencoder Host-Based Intrusion Detection System Trained on Benign Encrypted Network Traffic</h1><div class="meta">Using Flow-Based Behavioral Features<br><b>Nelson Mivule</b> · <b>Erecho Jonathan</b> · Supervisor: <b>Mr. Senfuka Huzaifah</b></div></div>',

['Presenters &amp; Project',C([['Nelson Mivule','MAY23/CSF/2990U/F<br>Co-developer and presenter'],['Erecho Jonathan','MAY23/CSF/3335U/F<br>Co-developer and presenter'],['Project title','An Autoencoder Host-Based Intrusion Detection System for Encrypted Network Traffic Using Flow-Based Behavioral Features'],['Supervisor','Mr. Senfuka Huzaifah, School of Computing and Engineering, UTAMU']])+'<div class="note"><b>Today:</b> how existing IDS tools work and where they fall short · how our system differs · how it was trained and what the results show, including the limits · architecture and features · challenges · then a live demo.</div>'],

['Literature Review: How IDS Work',L(['An IDS watches a network or host for suspicious activity and policy violations, then alerts the security team.','<b>Signature-based:</b> compares traffic with a database of known attack patterns (Snort, Suricata). Fast and precise for known threats, blind to new ones.','<b>Anomaly-based:</b> learns what normal looks like and flags deviations (Zeek-style baselining). Can catch novel attacks, but needs tuning.','<b>The encrypted-traffic problem:</b> with TLS, HTTPS and VPNs, payloads are unreadable, so pattern matching fails unless traffic is decrypted, which raises privacy, legal and performance issues.'])],

['How OSSEC Operates',C([['Architecture','A central manager collects data from agents installed on each host.'],['What it watches','System logs, file integrity and rootkit activity, in real time.'],['Detection','A correlation engine compares host events against a large XML rule set, then alerts or triggers automated responses.'],['Limitation','Rule setup is complex and noisy. It is log-based, so it cannot analyze network traffic and is blind to encrypted flows.']])],

['How Zeek Operates',C([['Architecture','Turns raw packets into high-level event streams that record behavior, not just packets.'],['Detection','Scripts run on those events and keep long-term state about network activity, enabling complex custom logic.'],['Strength','Rich behavioral logs and flexible analysis of what hosts are doing.'],['Limitation','Heavy CPU and memory use at high speed, and a specialized scripting language with a steep learning curve. Closest to our idea, but manual where ours learns automatically.']])],

['How Snort &amp; Suricata Operate',C([['Snort: capture','Captures and decodes packets, then preprocessors reassemble fragments and normalize the data.'],['Snort: detect','The engine matches traffic against a large rule database and alerts on a known signature. Zero-day attacks slip through.'],['Suricata: capture','Multi-threaded engine that spreads traffic across CPU cores for deep packet inspection and protocol identification.'],['Suricata: detect','Matches a signature library and extracts metadata. Large rule sets use much memory, and encrypted or obfuscated attacks evade it.']])],

['How Cisco Firepower Operates',C([['Dual-engine design','The LINA engine does fast Layer 3/4 filtering. The Snort 3 engine performs deep packet inspection for advanced threats.'],['Threat intelligence','Live feeds from Cisco Talos help enforce access policies and spot malware and anomalies.'],['Limitation','Complex management, slow interface, and DPI that degrades throughput on encrypted traffic without special hardware.'],['Cost','Licensing and hardware costs, plus vendor lock-in and a black-box model.']])],

['Research Gap &amp; Comparison','<div class="wrap"><table class="t1"><tr><th>Tool type</th><th>How it detects</th><th>Limitation</th><th>Our system</th></tr><tr><td>Signature (Snort, Suricata)</td><td>Pattern matching</td><td>Blind to zero-day; decryption overhead</td><td>Autoencoder reconstruction error</td></tr><tr><td>Anomaly (Zeek)</td><td>Event tracking, baselines</td><td>Manual scripting; rules-heavy</td><td>Learns normal behavior automatically</td></tr><tr><td>Host-based (OSSEC)</td><td>Logs, file integrity</td><td>Blind to encrypted flows</td><td>Host flow metadata (IAT, burstiness)</td></tr><tr><td>Hybrid (Cisco Firepower)</td><td>Dual-engine rules, proprietary ML</td><td>Cost, vendor lock-in, black-box</td><td>Open and lightweight</td></tr></table></div><div class="note">Suricata and Zeek are compared from the literature only; they were not run in our experiments.</div>'],

['How Our System Operates',F([['Capture','Scapy + BPF'],['Flows','5-tuple, ≥ 5 packets'],['Features','22-D vector'],['Autoencoder','22 → 4 → 22'],['Decision','MSE vs τ'],['Alert','SQLite + GUI']])+L(['It never decrypts anything. It reads only Layer 3/4 headers: timing, size, rate and flags.','It learns what normal traffic looks like with no attack labels and no signatures to update.','A flow the model cannot rebuild well has a high reconstruction error and is flagged.','Everything runs locally on the host, so no traffic leaves the machine.'])],

['From Packets to Features',L(['<b>Capture:</b> a background thread sniffs IPv4 packets with kernel BPF filters into a bounded queue (2,000 packets) so bursts do not freeze the app.','<b>Flow building:</b> a worker groups packets by source/destination IP, ports and protocol into flows.','<b>Features:</b> once a flow has 5 or more packets, 22 statistics are computed, transformed with log(1 + x) and Min-Max scaled to [0, 1] (scaler fitted on training data only).','<b>Encryption flag:</b> flows on TLS-type ports such as 443, or 1194 for OpenVPN, are tagged <b>is_encrypted</b>. The tag comes from the port, not from reading content.'])],

['The 22 Behavioral Metrics',N([['6','Timing: flow duration, inter-arrival time stats'],['5','Volume: packet length stats, total bytes'],['2','Rate: packets/s, bytes/s'],['3','Burstiness: length variance, burst ratio, active-time ratio'],['3','Session: packet count, unique TTLs, TTL mean'],['3','Protocol: TCP-flag ratio, has UDP, has TCP']])+'<div class="note">Only Layer 3/4 headers are used, so payloads are never read. <b>Offline caveat:</b> CICFlowMeter exports no TTL, so 7 of the 22 were derived from the closest CICFlowMeter columns during training; the live Scapy parser computes them directly.</div>'],

['The Autoencoder',F([['Input','22'],['Dense','16'],['Dense','8'],['Latent','4'],['Dense','8'],['Dense','16'],['Output','22']])+L(['Symmetric, <b>five hidden layers</b>, 1,194 parameters. The encoder squeezes 22 features into 4; the decoder tries to rebuild all 22.','Trained on <b>benign flows only</b> from CIC-IDS2017 (ISCX VPN-nonVPN informed the feature design). MSE loss, Adam at 1e-3, batch size 512, batch normalization, Dropout 0.1, early stopping.','Ran 100 epochs (best epoch 99) in <b>387 s</b> on a CPU-only laptop (Core i7-3687U, 8 GB RAM).'])],

['Data Split &amp; Alert Threshold','<div class="eq">τ = max( P99(RE<sub>benign</sub>) , μ + k·σ )</div>'+N([['458,936','Benign flows for <b>training</b> (70%)'],['98,343','Benign flows for <b>validation and calibration</b> (15%)'],['306,883','<b>Test</b>: 98,345 benign (15%) + 208,538 attack flows, 14 attack types'],['τ = 0.0242','μ = 0.0026, σ = 0.0047, k = 3','k fixed before the test data were examined']])+'<div class="note">The threshold is computed from benign validation errors only, so by construction about 1% of normal validation flows exceed it. Attack labels are used only to score the results.</div>'],

['Training &amp; Evaluation Results','<div class="res"><div><img src="'+""+'" alt="Autoencoder training and evaluation on CIC-IDS2017" id="trainimg"><div class="cap">Autoencoder training and evaluation on CIC-IDS2017 (general test set, 306,883 flows)</div></div>'+CB([['(a) Loss','Training and validation loss both plateau. Validation stays below training (dropout is active only in training): converged, no over-fitting.'],['(b) Error','Benign errors cluster near 10<sup>-3</sup>. Many attack flows overlap that range, so a threshold set for ~1% false alarms sits above most of them.'],['(c) ROC','AUC 0.957: reconstruction error ranks attack flows above benign ones.'],['(d) Matrix','TN 97,422 · FP 923 · FN 173,979 · TP 34,559. Precision 0.974, recall 0.166, F1 0.283.']])+'</div>'],

['Detection Results &amp; Baselines',N([['0.957','ROC-AUC','Ranks attacks above benign'],['0.974','Precision','34,559 of 35,482 alerts were real'],['0.166','Recall','173,979 of 208,538 attack flows missed',1],['0.94%','False-positive rate','923 of 98,345 benign flows']])+'<div class="wrap" style="margin-top:12px"><table class="t2"><tr><th>Model (same balanced test sample)</th><th>Precision</th><th>Recall</th><th>F1</th><th>FPR</th><th>ROC-AUC</th></tr><tr><td>Random Forest (supervised, uses labels)</td><td>0.998</td><td>0.996</td><td>0.997</td><td>0.0024</td><td>1.000</td></tr><tr><td>Isolation Forest (unsupervised, same rule)</td><td>0.012</td><td>0.000</td><td>0.000</td><td>0.0081</td><td>0.788</td></tr><tr class="me"><td>Autoencoder (this work)</td><td>0.946</td><td>0.168</td><td>0.286</td><td>0.0095</td><td>0.957</td></tr></table></div><div class="note warn"><b>Honest reading:</b> the autoencoder is the better unsupervised model, but at the calibrated threshold it detects a minority of attacks. The encrypted-port subset (56,667 flows) held no attacks, so only its false-positive rate (0.87%) was measurable.</div>'],

['Performance &amp; Privacy',N([['0.661 ms','End-to-end scoring per flow','1.44 ms at the 99th percentile; target &lt; 10 ms'],['0.0845 ms','Model inference per flow','NumPy forward pass; target &lt; 2 ms'],['1,965 /s','Sustained flows per second','98% of the 2,000/s target'],['3.1%','Of total CPU capacity','12.5% of one core; 890 MB memory']])+'<div class="note">Measured on a CPU-only laptop (Core i7-3687U, 4 logical cores, 8 GB RAM). These figures cover the detection engine only; packet capture, flow assembly, SQLite logging and the dashboard add load. <b>Privacy:</b> 22 header-only features, no payload access, nothing leaves the host.</div>'],

['Analyst Feedback Loop',C([['1 · Alert','A flow crosses τ and appears in the alert center with its anomaly score.'],['2 · Review','The analyst inspects all 22 features and marks it true or false positive.'],['3 · Fine-tune','At least 10 flagged false positives trigger incremental fine-tuning, with a checkpoint saved first to guard against drift.'],['4 · Recalibrate','The threshold is recomputed and the new weights persist across restarts.']])+'<div class="note">The analyst stays in control of what the model learns. <b>Scope:</b> the loop is implemented, but its effect on detection accuracy was not measured in this work.</div>'],

['System Architecture',P(L(['<b>Tier 1</b> Data acquisition &amp; preprocessing (Scapy)','<b>Tier 2</b> AI detection engine (TensorFlow/Keras)','<b>Tier 3</b> Persistence &amp; feedback (SQLite)','<b>Tier 4</b> Presentation layer (PySide6 GUI)','Docker Compose runs the FastAPI backend and the dashboard as separate containers'])+'',I('architecture','Four-tier architecture'))],

['Architecture: Design Decisions',C([['Producer-consumer pipeline','Capture, parsing and inference run on separate threads, so heavy traffic never blocks the interface.'],['Signal-slot GUI','PySide6 worker threads push live scores to the dashboard without freezing it.'],['Local forensic database','hids_forensics.db stores flows, feature vectors, anomaly scores, alerts and analyst feedback.'],['Containerized deployment','Dockerfiles for backend and dashboard, NET_ADMIN for capture, persistent volumes for the database and model files.']])],

['Live Monitoring Console',P(L(['Live anomaly-score curve against the threshold','Alert center and flow log','22-feature forensic inspector','True / false positive verdicts feeding the loop'])+'',I('dashboard','HIDS Sentinel console (PySide6)'))],

['Dashboard Modules',C3([['Console grid','Live telemetry, MSE chart versus threshold, flow table and remediation panel.'],['Network ingestion','Throughput, packet drops, buffer occupancy and all 22 feature dimensions.'],['Model analysis','Training loss, inference latency, per-feature reconstruction error and retraining pipeline.'],['Forensic reports','One-click timestamped incident reports with SOC2 / ISO27001 compliance status view.'],['Settings','Themes, threshold control, model paths and database endpoint.'],['Built-in documentation','Architecture, data pipeline, deployment and API reference inside the app.']])],

['Objectives Met Through the Methodology','<div class="wrap"><table class="t1"><tr><th>Specific objective</th><th>How the methodology met it</th><th>Result</th></tr><tr><td style="color:var(--tx);font-weight:700">1. Non-intrusive feature extraction</td><td style="color:var(--tx);font-weight:400">Scapy capture with BPF filters, 5-tuple flows (5+ packets), then 22 Layer 3/4 metadata features, log-scaled and Min-Max normalized. No payload is ever decrypted.</td><td>22-feature vector, no payload access; metadata-only design aligns with GDPR/HIPAA</td></tr><tr><td style="color:var(--tx);font-weight:700">2. Train &amp; optimize the autoencoder</td><td style="color:var(--tx);font-weight:400">Benign-only training on CIC-IDS2017 (70/15/15 split). 22→16→8→4→8→16→22, MSE, Adam 1e-3, BatchNorm, Dropout 0.1. Threshold τ = max(P99, μ + 3σ) = 0.0242.</td><td>ROC-AUC 0.957, FPR 0.94%, 0.661 ms per flow; recall 0.166 at τ</td></tr><tr><td style="color:var(--tx);font-weight:700">3. Deploy engine, backend &amp; forensics DB</td><td style="color:var(--tx);font-weight:400">Producer-consumer pipeline in Docker Compose with a FastAPI backend and SQLite logging. Unit, integration, system, performance and acceptance testing.</td><td>Reproducible containers and a local audit trail; 1,965 flows/s sustained</td></tr><tr><td style="color:var(--tx);font-weight:700">4. Real-time PySide6 interface</td><td style="color:var(--tx);font-weight:400">Iterative build from CLI prototype to dashboard. Worker threads with signal-slot updates keep the GUI responsive. Analyst feedback (10+ false positives) triggers checkpointed fine-tuning.</td><td>Live score curve vs. τ, alert center, 22-feature inspector, one-click reports</td></tr></table></div><div class="note"><b>General objective:</b> a standalone, containerized HIDS that uses an unsupervised autoencoder to detect hidden threats in encrypted traffic through flow-based behavioral analysis. <b>Status:</b> a working prototype with low latency and a privacy-preserving design, not yet a deployment-ready detector.</div>'],

['Challenges During Implementation',C3([['Dependencies','Reproducing TensorFlow/Keras, Scapy and Qt libraries consistently inside Docker.'],['Packet ingestion','Capturing high-rate traffic with Scapy without drops while inference kept pace.'],['Inference latency','A single Keras call took 16.3 ms; the NumPy and batched paths score a flow in well under 1 ms.'],['Container orchestration','Sharing the SQLite database between the FastAPI backend and PySide6 dashboard through volumes.'],['GUI responsiveness','Preventing logging, database writes and inference from blocking the interface; solved with worker threads and signals.'],['Threshold calibration','A ~1% false-alarm threshold gave recall of only 0.166. Seven features also had to be approximated from CICFlowMeter columns.']])],

['Limitations &amp; Next Steps',C3([['Low recall at τ','Only 16.6% of attack flows were flagged. Next: test a smaller k or a lower percentile, with per-attack detection rates.'],['Encrypted attacks untested','The encrypted-port subset held no attack flows. Next: attack traffic on encrypted-service ports and live traffic.'],['Offline, 2017 data','Evaluated on CIC-IDS2017 only. Next: newer TLS 1.3 / QUIC captures.'],['Not yet measured','Feedback-loop effect, drift over time and adversarial robustness. Next: drift detection and retraining.'],['Single host','One monitoring node. Next: multi-node fleet dashboard and federated learning.'],['Explainability &amp; layering','Next: show which features drive each alert, and cross-check with signature-based IDS.']])],
